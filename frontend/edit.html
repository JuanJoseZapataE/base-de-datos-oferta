<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editar ficha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root{ --sena-green:#007a3d; --sena-green-dark:#005a2a; --sena-green-light:#e9f7ec; }
      body { background: var(--sena-green-light); }
      .card { border: 1px solid rgba(0,0,0,0.04); }
      h3 { color: var(--sena-green-dark); }
      .btn-primary { background-color: var(--sena-green); border-color: var(--sena-green-dark); }
        .brand-header { background: linear-gradient(120deg, var(--sena-green-dark), var(--sena-green)); color:#fff; padding:10px 14px; border-radius:10px; }
        .brand-logo { width:44px; height:44px; object-fit:contain; background:#fff; border-radius:8px; padding:4px; }
        .brand-title { margin:0; font-weight:700; }
        .brand-subtitle { margin:0; opacity:0.9; font-size:0.92rem; }
    </style>
</head>
<body class="p-4">
    <div class="container">
      <div class="brand-header d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-3">
          <img class="brand-logo" src="src/logo_sena.png" onerror="this.onerror=null;this.src='src/logo_sena.svg';" alt="Logo SENA">
          <div>
            <h1 class="brand-title h5 mb-0">Editar ficha</h1>
            <small class="brand-subtitle">Edición de registro individual</small>
          </div>
        </div>
        <div>
          <a href="index.html" class="btn btn-outline-light btn-sm">Inicio</a>
          <a href="seguimiento_metas.html" class="btn btn-success btn-sm">Seguimiento</a>
        </div>
      </div>
    <div id="status" class="mb-2 text-muted"></div>
    <form id="editForm">
      <div class="row g-2" id="fields">
        <!-- Campos dinámicos -->
      </div>
      <div class="mt-3 d-flex flex-wrap gap-2">
        <button id="saveBtn" class="btn btn-primary" type="submit">Guardar</button>
        <a href="index.html" class="btn btn-secondary">Volver</a>
        <a href="indicativa.html" class="btn btn-outline-success">Modulo Indicativa</a>
        <a href="seguimiento_metas.html" class="btn btn-success">Ejecucion de metas</a>
      </div>
    </form>
  </div>
  <script src="edit.js"></script>
</body>
</html>
